<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070c18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="AERO2687 — Introduction to Aerospace Engineering: interactive 3D formula & variable web, exam radar, quizzes. Liquid-glass study tool." />
    <title>AERO2687 · Aerospace Study Web</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1224'/%3E%3Cpath d='M32 12 L38 34 L54 44 L54 50 L36 42 L34 52 L40 58 L40 61 L32 57 L24 61 L24 58 L30 52 L28 42 L10 50 L10 44 L26 34 Z' fill='%237cc4ff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // No-flash theme boot: apply saved theme before first paint
      (function () {
        try {
          var raw = localStorage.getItem('asw:aero2687:theme');
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = parsed && (parsed.value === 'light' || parsed.value === 'dark') ? parsed.value : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
